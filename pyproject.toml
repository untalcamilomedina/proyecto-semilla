[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-semilla"
version = "0.15.0"
description = "Boilerplate SaaS multitenant, seguro y AI-first (Django 5 + Next.js)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Camilo Medina" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "pytest-cov>=5.0",
  "factory-boy>=3.3",
  "freezegun>=1.5",
  "pre-commit>=3.7",
  "ruff>=0.8",
  "black>=24.8",
  "isort>=5.13",
  "bandit>=1.7",
  "djlint>=1.35",
  "pip-audit>=2.7",
  "safety>=3.2",
  "mypy>=1.12",
  "django-stubs>=5.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
  "config",
  "common",
  "core",
  "billing",
  "multitenant",
  "oauth",
  "cms",
  "lms",
  "community",
  "api",
  "mcp_registry",
  "crm",
]
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "DJ", "S", "RUF"]
# RUF012: los atributos de clase mutables (Meta, permission_classes, fields…)
# son el idioma estándar de Django/DRF. DJ008/DJ012: estilo de modelos legacy,
# pendiente en el plan de estabilización (no bloquea).
ignore = ["S101", "DJ001", "RUF012", "DJ008", "DJ012"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "S"]
"**/tests/*.py" = ["S", "E501"]
"tests/*.py" = ["S", "E501"]
"src/config/settings/*.py" = ["E402", "F403", "F405"]

[tool.bandit]
exclude_dirs = ["tests", "src/**/migrations"]
# B105/B107: falsos positivos (mensajes de validación/i18n y rutas de clase).
# B110: try/except-pass justificados inline (Sentry opcional, métricas, emails).
skips = ["B101", "B105", "B107", "B110"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"
exclude = "migrations"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
warn_return_any = false
strict_optional = true

# Overrides para fricción legacy con django-stubs (44 errores heredados).
# Plan: eliminarlos módulo a módulo (ver docs/auditoria/PLAN-ESTABILIZACION.md
# Fase 3). El código nuevo debe pasar mypy SIN añadir entradas aquí.
[[tool.mypy.overrides]]
module = ["lms.*", "community.*", "mcp_registry.*"]
disable_error_code = ["attr-defined", "dict-item"]

[[tool.mypy.overrides]]
module = ["cms.*", "multitenant.*"]
disable_error_code = ["django-manager-missing", "misc"]

[[tool.mypy.overrides]]
module = ["billing.*", "core.*"]
disable_error_code = [
  "misc",
  "arg-type",
  "var-annotated",
  "assignment",
  "return-value",
  "django-manager-missing",
]

[[tool.mypy.overrides]]
module = ["common.*"]
disable_error_code = ["override", "arg-type"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
addopts = "-ra --strict-markers --disable-warnings --cov=src --cov-report=term-missing"
testpaths = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Gate honesto: 70.16% medido en CI (2026-06). El 90 anterior era aspiracional
# y nunca se midió. Plan: subir gradualmente (ver docs/auditoria, Fase 2).
fail_under = 70

[tool.djlint]
profile = "django"
blank_line_after_tag = "load,extends,include"
max_line_length = 100
ignore = "H006,H030,H031"
