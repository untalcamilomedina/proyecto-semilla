site_name: Proyecto Semilla
site_description: Boilerplate SaaS multitenant, seguro y AI-first (Django 5 + Next.js).
repo_name: untalcamilomedina/proyecto-semilla
repo_url: https://github.com/untalcamilomedina/proyecto-semilla

theme:
  name: material
  language: es
  features:
    - navigation.expand
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - API: api.md
  - MCP: mcp.md
  - Arnés de IA: arnes-ia.md
  - Memoria (Basic Memory): memoria/proyecto-semilla-estado.md
  - Multitenancy: multitenancy.md
  - RBAC: rbac.md
  - Billing: billing.md
  - Observability: observability.md
  - Auditoría:
      - auditoria/2026-06-informe-auditoria.md
      - auditoria/PLAN-ESTABILIZACION.md
  - ADRs:
      - adr/0001-repo-root.md
      - adr/0002-tooling.md
      - adr/0005-multitenancy-schema.md
      - adr/0009-billing-stripe.md
      - adr/0010-api.md
      - adr/0011-frontend.md
      - adr/0012-observability.md
      - adr/0013-frontend-nextjs.md
  - Runbooks:
      - runbooks/local-dev.md
      - runbooks/operacion.md
      - runbooks/flyio.md
      - runbooks/migracion-frontend-nextjs.md
